name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish, with an optional v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install release tools
        run: uv sync --locked --only-group dev
      - name: Match tag or input to the package version
        id: version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: uv run --no-sync python tools/check_release_version.py "$RELEASE_VERSION"

  ci:
    name: Required quality checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  package:
    name: Required package checks
    needs: validate
    uses: ./.github/workflows/package.yml

  publish:
    name: Publish to PyPI
    needs: [ci, package]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/pyside6-native-titlebar/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push'
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download published distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist
      - name: Create release and attach distributions
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}

name: Package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-24.04
    outputs:
      wheel_filename: ${{ steps.distribution.outputs.wheel_filename }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install release tools
        run: uv sync --locked --only-group dev
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Check package metadata and README
        run: uv run --no-sync twine check --strict dist/*
      - name: Resolve wheel filename
        id: distribution
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          echo "wheel_filename=$(basename "${wheels[0]}")" >> "$GITHUB_OUTPUT"
      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  install:
    name: Install on Windows / Python ${{ matrix.python }}
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Download verified distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist
      - name: Test the installed wheel without the source checkout
        run: >-
          uv run --isolated --no-project --python "${{ matrix.python }}"
          --with "./dist/${{ needs.build.outputs.wheel_filename }}"
          python tools/package_smoke.py
